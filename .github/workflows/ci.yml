name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      # `~/.cache/ort.pyke.io` must be cached together with `target`. fastembed
      # pulls ort-sys, whose build script downloads ONNX Runtime into that
      # directory and then emits an absolute `-L` pointing at it. That `-L` is
      # recorded in `target/**/build/ort-sys-*/output`, and cargo replays the
      # recorded output instead of re-running the script (registry sources never
      # change, so its fingerprint stays fresh). Caching `target` alone therefore
      # restores an `-L` to a directory that does not exist on a fresh runner,
      # and rustc fails the moment it rebuilds the ort-sys lib with
      # "could not find native static library `onnxruntime`". Both paths live in
      # one cache entry, so they are saved and restored together and cannot drift.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      # The tests/tmux_*.rs targets (split_hook, lifecycle, window_targets) drive
      # a real tmux server (each on its own private socket) because the mock
      # layer cannot observe which pane tmux delivers keystrokes to, which cwd a
      # pane resolves, or how many panes a window ends up with. Without tmux those
      # tests skip, so install it explicitly rather than relying on whatever the
      # runner image happens to ship. They fail rather than skip when CI is set,
      # so dropping this step cannot quietly turn them into a no-op.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Run tests
        run: cargo test --target x86_64-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      # See the Test job's cache step for why ~/.cache/ort.pyke.io is here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run clippy
        run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      # See the Test job's cache step for why ~/.cache/ort.pyke.io is here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      # Same reason as the test job: tarpaulin runs the suite, and without tmux
      # the real-tmux tests (the tests/tmux_*.rs targets) skip, understating
      # coverage.
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --target x86_64-unknown-linux-gnu --out xml --output-dir coverage/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

      - name: Coverage summary
        run: cargo tarpaulin --target x86_64-unknown-linux-gnu --out stdout --skip-clean

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  doc-paths:
    name: Check CLAUDE.md paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate path references in CLAUDE.md
        run: ./scripts/check-doc-paths.sh

      - name: Self-test the doc-path checker
        run: bash ./scripts/test-check-doc-paths.sh
