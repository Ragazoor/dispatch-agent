#!/usr/bin/env bash
# log-warnings.conf — configuration for fetch-log-warnings.sh.
#
# Empty LOG_FILE means the script is inert and emits []. Set both values to
# turn the feed on:
#
# LOG_FILE="$HOME/.local/share/dispatch/app.log"
# REPO_URL="https://github.com/myorg/myrepo"
#
# REPO_URL is the GitHub root of the repo the log belongs to. Dispatch matches
# its last path segment against your registered clones to give each created
# task a repo_path, so it can be dispatched into a worktree. Without it the
# cards still appear but cannot be dispatched.
#
# Remember to set feed_append_only on the epic — see the script's header.
#
# Optional:
#   LEVELS="WARN|ERROR"   which severities become cards
#   SAMPLES=3             raw lines quoted in each card's description
LOG_FILE=""
REPO_URL=""
