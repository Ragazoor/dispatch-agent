#!/usr/bin/env bash
# bots.conf — bot author logins for fetch-reviews.sh's bot-author pass.
#
# This pass emits every open PR authored by one of these bots in one of
# repos.conf's REPOS, whether or not you are a requested reviewer on it. Those
# PRs route to the Bots sub-epic. Without this file, a Renovate or Dependabot
# PR only reaches Bots when you happen to be a requested reviewer — which for
# dependency-update PRs is the exception, not the rule.
#
# Scope is repos.conf's REPOS only: it is deliberately never run org-scoped
# (unlike the review queries in org.conf), because org-wide bot authorship
# sweeps in every dependency-update PR in the org.
#
# Use gh search's app form, "app/<slug>". The slug is deployment-specific: a
# self-hosted Renovate app is named after the org that installed it, so it is
# app/kognic-renovate, NOT app/renovate. Check yours with:
#
#   gh pr list --repo owner/repo --state open --json author
#
# Add "app/<slug>" entries, one per line:
#
# BOT_AUTHORS=(
#   "app/my-org-renovate"
#   "app/dependabot"
# )
BOT_AUTHORS=()
